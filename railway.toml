# Railway Configuration File
# This file is a fallback configuration.
# For service-specific configurations, see:
# - backend/railway.json (for backend service)
# - frontend/railway.json (for frontend service)
#
# Railway will auto-detect the correct Dockerfile per service:
# - Backend service: backend/Dockerfile
# - Frontend service: frontend/Dockerfile

# If Railway doesn't auto-detect, you can set per-service in the dashboard:
# - Backend: Settings → Build → Dockerfile Path: backend/Dockerfile
# - Frontend: Settings → Build → Dockerfile Path: frontend/Dockerfile

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

